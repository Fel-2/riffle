[package]
name = "riffle"
version = "0.3.0"
edition = "2021"
description = "A fast terminal file manager with previews, tabs and git status"
license = "MIT"
repository = "https://github.com/Fel-2/riffle"
readme = "README.md"
keywords = ["tui", "file-manager", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[features]
default = ["jxl"]
# JPEG XL previews via the pure-Rust `jxl-oxide` decoder. It accounts for most
# of the release binary's size, so it can be dropped entirely with
# `cargo build --no-default-features` if you never preview JPEG XL files.
jxl = ["dep:jxl-oxide"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
fuzzy-matcher = "0.3"
chrono = "0.4"
dirs = "5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico", "tga"] }
jxl-oxide = { version = "0.12", features = ["moxcms"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
